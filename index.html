<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسواق الريشي</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7b5f">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الريشي"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mu:#76736b;--pr:#0f7b5f;--pr2:#e3f3ee;--bd:#e8e4da;--bl:#2a1fa0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f2efe8;--mu:#a09c92;--pr:#35c49b;--pr2:#1b3a31;--bd:#2d2d2a;--bl:#9aa0ff}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f2efe8;--mu:#a09c92;--pr:#35c49b;--pr2:#1b3a31;--bd:#2d2d2a;--bl:#9aa0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 8px}
h1{margin:0 0 8px;font-size:22px;color:var(--bl)}
header h1{margin:0}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:72px;width:auto;background:#fff;border-radius:16px;padding:6px;border:1px solid var(--bd)}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.search,.f{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.search{margin-top:12px}.f{margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-family:inherit}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.chip.sm{padding:6px 12px;font-size:13px;background:var(--pr2);border-color:transparent}
.chip.sm.on{background:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px}
.sec{grid-column:1/-1;font-size:18px;font-weight:700;margin-top:10px;border-right:4px solid var(--pr);padding-right:10px}
.ssub{grid-column:1/-1;font-size:14px;color:var(--pr);font-weight:700}
.p{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.img{height:120px;display:flex;align-items:center;justify-content:center;font-size:52px;background:var(--pr2);overflow:hidden}
.img img,.e img{width:100%;height:100%;object-fit:cover}
.pb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-size:14px;font-weight:600}.pp{color:var(--pr);font-weight:700}
.add,.btn{border:0;background:var(--pr);color:#fff;padding:11px;border-radius:12px;font-size:14px;font-family:inherit}
.add{margin-top:auto}
.btn{width:100%;font-size:16px;font-weight:700;margin-top:6px}.btn.wa{background:#25a244}.btn.gr{background:var(--mu)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}.empty.soon{padding:12px 0}
.pg{padding:16px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.row .e{font-size:30px;width:52px;height:52px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--pr2);flex:none}
.row .i{flex:1}
.q{display:flex;align-items:center;gap:8px}
.q button,.ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.lbl{display:block;font-size:13px;color:var(--mu);margin:6px 2px 4px}
.box{background:var(--pr2);border-radius:12px;padding:12px;margin:4px 0 8px;font-size:14px;line-height:1.7}
.tl{display:flex;justify-content:space-between;margin:4px 2px}.tl.b{font-weight:700;font-size:18px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;line-height:1.8;white-space:pre-line}
.card h3{margin:0 0 6px;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:12px;position:relative;font-family:inherit}
nav button.on{color:var(--pr)}nav span{display:block;font-size:22px}
.badge{position:absolute;top:-4px;right:calc(50% - 22px);background:#d9442f;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
#pv{max-width:140px;border-radius:12px;display:none;margin:4px 0 8px}
.pk{flex:1;display:block;text-align:center;padding:11px;border-radius:12px;background:var(--mu);color:#fff;font-size:14px}.st{margin:18px 0 6px;font-size:16px;color:var(--bl)}.rw{position:relative;padding-left:52px}.rw .ic{position:absolute;left:10px;top:10px}
body,button,input,select,textarea{font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.hd{background:linear-gradient(135deg,var(--pr2),var(--bg));border-radius:0 0 28px 28px;padding:18px 16px 16px;margin-bottom:4px}
.hd h1{font-size:24px;font-weight:800}
.pill{display:inline-block;margin-top:6px;background:var(--pr);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px}
.hd .search{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.grid{gap:14px}
.sec{font-size:20px;font-weight:800;border-right:0;padding:0;margin-top:14px;display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:5px;height:22px;border-radius:3px;background:var(--pr)}
.ssub{background:var(--pr2);padding:4px 12px;border-radius:14px;width:fit-content}
.p{border-radius:22px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.img{position:relative;height:130px;font-size:58px;background:var(--pr2)}
.img .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;mix-blend-mode:multiply}
@media(prefers-color-scheme:dark){.img .ph{mix-blend-mode:normal;background:#fff}}
.img[data-s="دقيق وقمح"]{background:rgba(240,190,60,.22)}
.img[data-s="معلبات"]{background:rgba(230,110,90,.18)}
.img[data-s="ألبان"]{background:rgba(90,150,230,.18)}
.img[data-s="مشروبات"]{background:rgba(60,190,160,.2)}
.img[data-s="نودلز وبسكويت"]{background:rgba(240,160,70,.2)}
.img[data-s="توابل وبيض"]{background:rgba(230,130,80,.2)}
.img[data-s="شوكولاتة وحلويات"]{background:rgba(150,90,60,.2)}
.img[data-s="سكر وزيوت"]{background:rgba(240,200,60,.22)}
.img[data-s="منظفات ومستلزمات"]{background:rgba(70,160,230,.2)}
.pn{font-size:14px;font-weight:700;line-height:1.35;min-height:38px}
.us{display:flex;flex-wrap:wrap;gap:5px}
.u{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:4px 9px;font-size:12px}
.u.on{background:var(--pr);border-color:var(--pr);color:#fff}
.pp{font-size:17px;font-weight:800}.pp small{font-size:11px;font-weight:500;color:var(--mu)}
.add{border-radius:14px;font-weight:700}
.cb{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:8}
.bnr{position:relative;margin:12px 16px 4px;height:132px;border-radius:22px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.bn{position:absolute;inset:0;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px;color:#fff;opacity:0;transform:translateX(34px);transition:opacity .6s,transform .6s;overflow:hidden}
.bn.on{opacity:1;transform:none}
.bn h2{font-size:21px;font-weight:800;position:relative;max-width:70%}
.bn p{font-size:13px;opacity:.95;position:relative;max-width:70%}
.bn:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14);left:-40px;top:-60px;animation:fl 6s ease-in-out infinite}
.bn .ic{position:absolute;left:26px;bottom:26px;font-size:52px;animation:bob 3s ease-in-out infinite}
@keyframes fl{50%{transform:translate(24px,18px) scale(1.15)}}
@keyframes bob{50%{transform:translateY(-9px) rotate(-4deg)}}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:.3s}
.dots i.on{width:18px;background:#fff}
#offs .sec{padding:0 16px;margin:14px 0 8px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 14px;scroll-snap-type:x mandatory}
.hs .p{min-width:172px;max-width:172px;scroll-snap-align:start}
.off{position:absolute;top:10px;left:10px;background:#e03131;color:#fff;border-radius:12px;padding:3px 9px;font-weight:800;font-size:13px;z-index:2;animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.1)}}
.was{color:var(--mu);font-size:13px;font-weight:500}
.bn.bi:before,.bn.bi .ic{display:none}
.bn.bi{justify-content:flex-end;cursor:pointer}
.bn.bt:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 65%)}
.bn.bi h2,.bn.bi p{z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.7);max-width:92%}
.inst{margin:10px 16px 0;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;gap:8px;align-items:center;font-size:13.5px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.inst span{flex:1;line-height:1.55}
.ib{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:700;font-family:inherit}
.ix{background:transparent;border:0;color:var(--mu);font-size:18px;padding:2px 6px}
@media(prefers-reduced-motion:reduce){.bn,.bn:before,.bn .ic,.off{animation:none;transition:none}}
</style>
</head>
