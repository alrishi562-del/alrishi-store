<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسواق الريشي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mu:#76736b;--pr:#0f7b5f;--pr2:#e3f3ee;--bd:#e8e4da;--bl:#2a1fa0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f2efe8;--mu:#a09c92;--pr:#35c49b;--pr2:#1b3a31;--bd:#2d2d2a;--bl:#9aa0ff}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f2efe8;--mu:#a09c92;--pr:#35c49b;--pr2:#1b3a31;--bd:#2d2d2a;--bl:#9aa0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 8px}
h1{margin:0 0 8px;font-size:22px;color:var(--bl)}
header h1{margin:0}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:72px;width:auto;background:#fff;border-radius:16px;padding:6px;border:1px solid var(--bd)}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.search,.f{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.search{margin-top:12px}.f{margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-family:inherit}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.chip.sm{padding:6px 12px;font-size:13px;background:var(--pr2);border-color:transparent}
.chip.sm.on{background:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px}
.sec{grid-column:1/-1;font-size:18px;font-weight:700;margin-top:10px;border-right:4px solid var(--pr);padding-right:10px}
.ssub{grid-column:1/-1;font-size:14px;color:var(--pr);font-weight:700}
.p{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.img{height:120px;display:flex;align-items:center;justify-content:center;font-size:52px;background:var(--pr2);overflow:hidden}
.img img,.e img{width:100%;height:100%;object-fit:cover}
.pb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-size:14px;font-weight:600}.pp{color:var(--pr);font-weight:700}
.add,.btn{border:0;background:var(--pr);color:#fff;padding:11px;border-radius:12px;font-size:14px;font-family:inherit}
.add{margin-top:auto}
.btn{width:100%;font-size:16px;font-weight:700;margin-top:6px}.btn.wa{background:#25a244}.btn.gr{background:var(--mu)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}.empty.soon{padding:12px 0}
.pg{padding:16px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.row .e{font-size:30px;width:52px;height:52px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--pr2);flex:none}
.row .i{flex:1}
.q{display:flex;align-items:center;gap:8px}
.q button,.ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.lbl{display:block;font-size:13px;color:var(--mu);margin:6px 2px 4px}
.box{background:var(--pr2);border-radius:12px;padding:12px;margin:4px 0 8px;font-size:14px;line-height:1.7}
.tl{display:flex;justify-content:space-between;margin:4px 2px}.tl.b{font-weight:700;font-size:18px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;line-height:1.8;white-space:pre-line}
.card h3{margin:0 0 6px;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:12px;position:relative;font-family:inherit}
nav button.on{color:var(--pr)}nav span{display:block;font-size:22px}
.badge{position:absolute;top:-4px;right:calc(50% - 22px);background:#d9442f;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
#pv{max-width:140px;border-radius:12px;display:none;margin:4px 0 8px}
.pk{flex:1;display:block;text-align:center;padding:11px;border-radius:12px;background:var(--mu);color:#fff;font-size:14px}.st{margin:18px 0 6px;font-size:16px;color:var(--bl)}.rw{position:relative;padding-left:52px}.rw .ic{position:absolute;left:10px;top:10px}
body,button,input,select,textarea{font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.hd{background:linear-gradient(135deg,var(--pr2),var(--bg));border-radius:0 0 28px 28px;padding:18px 16px 16px;margin-bottom:4px}
.hd h1{font-size:24px;font-weight:800}
.pill{display:inline-block;margin-top:6px;background:var(--pr);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px}
.hd .search{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.grid{gap:14px}
.sec{font-size:20px;font-weight:800;border-right:0;padding:0;margin-top:14px;display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:5px;height:22px;border-radius:3px;background:var(--pr)}
.ssub{background:var(--pr2);padding:4px 12px;border-radius:14px;width:fit-content}
.p{border-radius:22px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.img{position:relative;height:130px;font-size:58px;background:var(--pr2)}
.img .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img[data-s="دقيق وقمح"]{background:rgba(240,190,60,.22)}
.img[data-s="معلبات"]{background:rgba(230,110,90,.18)}
.img[data-s="ألبان"]{background:rgba(90,150,230,.18)}
.img[data-s="مشروبات"]{background:rgba(60,190,160,.2)}
.img[data-s="نودلز وبسكويت"]{background:rgba(240,160,70,.2)}
.img[data-s="توابل وبيض"]{background:rgba(230,130,80,.2)}
.pn{font-size:14px;font-weight:700;line-height:1.35;min-height:38px}
.us{display:flex;flex-wrap:wrap;gap:5px}
.u{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:4px 9px;font-size:12px}
.u.on{background:var(--pr);border-color:var(--pr);color:#fff}
.pp{font-size:17px;font-weight:800}.pp small{font-size:11px;font-weight:500;color:var(--mu)}
.add{border-radius:14px;font-weight:700}
.cb{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:8}
.bnr{position:relative;margin:12px 16px 4px;height:132px;border-radius:22px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.bn{position:absolute;inset:0;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px;color:#fff;opacity:0;transform:translateX(34px);transition:opacity .6s,transform .6s;overflow:hidden}
.bn.on{opacity:1;transform:none}
.bn h2{font-size:21px;font-weight:800;position:relative;max-width:70%}
.bn p{font-size:13px;opacity:.95;position:relative;max-width:70%}
.bn:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14);left:-40px;top:-60px;animation:fl 6s ease-in-out infinite}
.bn .ic{position:absolute;left:16px;bottom:10px;font-size:62px;animation:bob 3s ease-in-out infinite}
@keyframes fl{50%{transform:translate(24px,18px) scale(1.15)}}
@keyframes bob{50%{transform:translateY(-9px) rotate(-4deg)}}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:.3s}
.dots i.on{width:18px;background:#fff}
#offs .sec{padding:0 16px;margin:14px 0 8px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 14px;scroll-snap-type:x mandatory}
.hs .p{min-width:172px;max-width:172px;scroll-snap-align:start}
.off{position:absolute;top:10px;left:10px;background:#e03131;color:#fff;border-radius:12px;padding:3px 9px;font-weight:800;font-size:13px;z-index:2;animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.1)}}
.was{color:var(--mu);font-size:13px;font-weight:500}
@media(prefers-reduced-motion:reduce){.bn,.bn:before,.bn .ic,.off{animation:none;transition:none}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=JSON.parse($("data").textContent),S=()=>D.settings,cur=()=>esc(S().cur);
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tab="h",cat="الكل",sub="الكل",q="",admin=false,av="p",editId=null,tmpImg="",ed=null,rcpt=null,rcptUrl="",rt={reason:"تالف"},delId=null;

const thumb=p=>p.img?`<img src="${p.img}" alt="">`:(p.e||"🛍️");

const cartN=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const subtotal=()=>Object.entries(cart).reduce((t,[id,n])=>t+(P(id)?P(id).p*n:0),0);
const pays=()=>[...S().wallets.map(w=>({t:"محفظة "+w.n,d:w.num+(w.holder?" — باسم "+w.holder:"")})),...S().banks.map(b=>({t:"حوالة/بنك "+b.n,d:b.num+(b.holder?" — باسم "+b.holder:"")}))];

/* ---------- المتجر ---------- */
const CI={"مواد غذائية":"🛒","إكسسوارات":"🎧","إلكترونيات":"📱","ملابس":"👕"};
const GI={},sel={};const gk=t=>GI[t]??(GI[t]=Object.keys(GI).length);
const nm=p=>p.g?p.g+" ("+p.u+")":p.n;

const selP=g=>g.v.find(x=>x.id==sel[g.k])||g.v[0];
const card=g=>{const p=selP(g),f=g.v[0];return `<div class="p"><div class="img" data-s="${esc(f.s||"")}"><span class="em">${f.e||"🛍️"}</span>${f.img?`<img class="ph" src="${f.img}" alt="">`:`<img class="ph" src="img/${f.id}.jpg" alt="" onerror="this.remove()">`}${p.old>p.p?`<span class="off">-${Math.round((p.old-p.p)/p.old*100)}%</span>`:""}</div><div class="pb"><div class="pn">${esc(g.t)}</div>${g.v.length>1?`<div class="us">${g.v.map(x=>`<button class="u${x.id==p.id?" on":""}" onclick="pickU(${g.k},${x.id})">${esc(x.u||"")}</button>`).join("")}</div>`:(p.u?`<div class="sub">${esc(p.u)}</div>`:"")}<div class="pp">${p.old>p.p?`<s class="was">${fm(p.old)}</s> `:""}${fm(p.p)} <small>${cur()}</small></div><button class="add" onclick="add(${p.id})">＋ أضف للسلة</button></div></div>`};
const pickU=(k,id)=>{sel[k]=id;$("grid").innerHTML=gridH();if($("offs"))$("offs").innerHTML=offsH()};
const offsH=()=>{const l=D.products.filter(p=>!p.hide&&p.old>p.p);if(!l.length||q.trim()||cat!="الكل")return "";return `<div class="sec">🔥 التخفيضات</div><div class="hs">${grp(l).map(card).join("")}</div>`};
const bnrH=()=>{const s=S(),offs=D.products.some(p=>!p.hide&&p.old>p.p);
  const b=(s.banners&&s.banners.length)?s.banners:[
    {t:"أهلاً بك في "+s.name,s:(s.eta?"توصيل "+s.eta:"")+(s.minOrder?" • أقل طلب "+fm(s.minOrder)+" "+cur():""),c:"#0f7b5f,#1fb58a",e:"🛒"},
    ...(offs?[{t:"🔥 تخفيضات اليوم",s:"أسعار مخفضة على منتجات مختارة",c:"#e8590c,#f08c00",e:"🏷️"}]:[]),
    {t:"وفّر أكثر بالكرتون",s:"سعر الكرتون أوفر من شراء الحبة",c:"#5f3dc4,#4263eb",e:"📦"}];
  return `<div class="bnr">${b.map((x,i)=>{const c=(x.c||"#0f7b5f,#1fb58a").split(",");return `<div class="bn${i?"":" on"}" style="background:linear-gradient(135deg,${c[0]},${c[1]||c[0]})"><h2>${esc(x.t)}</h2><p>${esc(x.s||"")}</p><span class="ic">${x.e||""}</span></div>`}).join("")}<div class="dots">${b.map((x,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div></div>`};
setInterval(()=>{const s=document.querySelectorAll(".bn");if(s.length<2)return;const d=document.querySelectorAll(".dots i");let c=[...s].findIndex(x=>x.classList.contains("on"));c=(c+1)%s.length;s.forEach((x,i)=>x.classList.toggle("on",i==c));d.forEach((x,i)=>x.classList.toggle("on",i==c))},4000);
const cartBar=()=>cartN()&&tab=="h"?`<div class="cb" onclick="go('c')"><span>🛒 ${cartN()} منتج</span><b>${fm(subtotal())} ${cur()}</b><span>عرض السلة ‹</span></div>`:"";
function gridH(){
  const s=q.trim();let h="";
  D.cats.filter(c=>cat=="الكل"||c==cat).forEach(c=>{
    const all=D.products.filter(p=>!p.hide&&p.c==c&&(p.n.includes(s)||(p.g||"").includes(s)));
    const ss=D.subs[c]||[],pick=sub=="الكل"||cat!=c,parts=[];
    ss.filter(x=>pick||x==sub).forEach(x=>{const l=all.filter(p=>p.s==x);if(l.length)parts.push([x,l])});
    const rest=all.filter(p=>!ss.includes(p.s));if(rest.length&&pick)parts.push([null,rest]);
    if(!parts.length){if(!s)h+=`<div class="sec">${esc(c)}</div><div class="empty soon">🚧 قريباً</div>`;return}
    h+=`<div class="sec">${esc(c)}</div>`;
    parts.forEach(([x,l])=>{if(x)h+=`<div class="ssub">${esc(x)}</div>`;h+=grp(l).map(card).join("")});
  });
  return h||'<div class="empty">لا توجد نتائج</div>';
}
function home(){
  const s=S(),ss=cat!="الكل"?(D.subs[cat]||[]):[];
  return `<header class="hd"><div class="brand">${s.logo?`<img class="logo" src="${s.logo}" alt="">`:""}<div><h1>${esc(s.name)}</h1><div class="sub">${esc(s.hours||"")}</div>${s.eta?`<div class="pill">🚚 ${esc(s.eta)}</div>`:""}</div></div><input class="search" placeholder="🔍 ابحث عن منتج..." value="${esc(q)}" oninput="q=this.value;$('grid').innerHTML=gridH();$('offs').innerHTML=offsH()"></header>
  ${bnrH()}
  <div class="chips">${["الكل",...D.cats].map((c,i)=>`<button class="chip ${c==cat?"on":""}" onclick="setCat(${i-1})">${CI[c]?CI[c]+" ":""}${esc(c)}</button>`).join("")}</div>
  ${ss.length?`<div class="chips" style="padding-top:0">${["الكل",...ss].map((c,i)=>`<button class="chip sm ${c==sub?"on":""}" onclick="setSub(${i-1})">${esc(c)}</button>`).join("")}</div>`:""}
  <div id="offs">${offsH()}</div><div class="grid" id="grid">${gridH()}</div>`;
}
const setCat=i=>{cat=i<0?"الكل":D.cats[i];sub="الكل";render()};
const setSub=i=>{sub=i<0?"الكل":D.subs[cat][i];render()};
function add(id){cart[id]=(cart[id]||0)+1;LS.s("cart",cart);toast("تمت الإضافة ✓");$("nav").innerHTML=navV()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];LS.s("cart",cart);render()}

/* ---------- السلة والطلب ---------- */
function cartV(){
  const e=Object.entries(cart).filter(([id])=>P(id)),s=S(),py=pays();
  if(!e.length)return `<div class="pg"><h1>🛒 السلة</h1><div class="empty">السلة فارغة</div></div>`;

  <div class="tl b"><span>الإجمالي</span><span>${fm(sb+fee)} ${cur()}</span></div>
  ${s.minOrder?`<div class="sub">الحد الأدنى للطلب ${fm(s.minOrder)} ${cur()}</div>`:""}

}
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",.75);c.toBlob(b=>cb(u,new File([b],"photo.jpg",{type:"image/jpeg"})),"image/jpeg",.75)};im.onerror=()=>cb(r.result,f);im.src=r.result};r.onerror=()=>toast("تعذّر قراءة الصورة، جرّب صورة ثانية");r.readAsDataURL(f)}
const pickRc=i=>{const f=i.files[0];if(f){shrink(f,1000,(u,b)=>{rcpt=b;rcptUrl=u;render();toast("تم إرفاق السند ✅")});setTimeout(()=>{try{i.value=""}catch(e){}},0)}};
const pickRt=i=>{const f=i.files[0];if(f)shrink(f,1000,(u,b)=>{rt.file=b;rt.url=u;render()})};
const pickLogo=i=>{const f=i.files[0];if(f)shrink(f,220,u=>{ed.logo=u;render()})};
const pickBtns=h=>`<div class="tl" style="gap:8px"><label class="pk">📷 تصوير<input type="file" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" onchange="${h}(this)"></label><label class="pk">🖼️ إرفاق صورة<input type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" onchange="${h}(this)"></label></div>`;
const rcBlock=()=>`<label class="lbl">صورة سند الحوالة</label>`+pickBtns("pickRc")+`<div class="sub">لو ما اشتغلت الكاميرا اضغط «إرفاق صورة» واختر الكاميرا أو المعرض، أو أرسل السند في واتساب بعد الطلب.</div>`+(rcptUrl?`<img src="${rcptUrl}" alt="" style="max-width:140px;border-radius:12px;margin:6px 0">`:"");
function sendWa(msg,file,ok){
  const wa=()=>{window.open("https://wa.me/"+S().whatsapp+"?text="+encodeURIComponent(msg),"_blank");ok()};
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){toast("اختر واتساب ثم محادثة المتجر "+S().whatsapp);navigator.share({files:[file],text:msg}).then(ok).catch(e=>{if(!e||e.name!="AbortError")wa()})}
  else{wa();if(file)toast("أرفق صورة السند داخل محادثة واتساب")}
}
function order(){
  const e=Object.entries(cart).filter(([id])=>P(id)),s=S(),py=pays();
  if(!prof.name||!prof.phone||!prof.addr)return toast("أكمل الاسم والجوال والعنوان");
  if(co.zone<0)return toast("اختر منطقة التوصيل");
  if(py.length&&co.pay<0)return toast("اختر طريقة الدفع");
  const sb=subtotal();if(s.minOrder&&sb<s.minOrder)return toast("الحد الأدنى للطلب "+fm(s.minOrder)+" "+s.cur);
  if(py.length&&!rcpt&&!co.noRc){co.noRc=true;return toast("لم تُرفق صورة السند. اضغط إرسال مرة أخرى للمتابعة بدونها")}
  const z=s.zones[co.zone],tot=sb+ +z.fee;
  const lines=e.map(([id,n])=>{const p=P(id);return `• ${nm(p)} × ${n} = ${fm(p.p*n)}`}).join("\n");
  const msg=`طلب جديد من ${s.name}\n\n${lines}\n\nالمنتجات: ${fm(sb)} ${s.cur}\nالتوصيل (${z.n}): ${fm(z.fee)} ${s.cur}\nالإجمالي: ${fm(tot)} ${s.cur}\n\nالاسم: ${prof.name}\nالجوال: ${prof.phone}\nالعنوان: ${prof.addr}\n${z.agent?"المندوب: "+z.agent+"\n":""}الدفع: ${py.length?py[co.pay].t+(rcpt?"\n(مرفق صورة السند)":"\n(سأرسل صورة السند لاحقاً)"):"—"}`;
  sendWa(msg,py.length?rcpt:null,()=>{orders.unshift({d:new Date().toLocaleDateString("ar"),t:tot,n:e.length,items:e.map(([id,q])=>{const p=P(id);return {id:id,n:nm(p),q:+q,p:+p.p}}),ret:[]});LS.s("orders",orders.slice(0,30));cart={};LS.s("cart",cart);co={zone:-1,pay:-1};rcpt=null;rcptUrl="";render()});
}
function sendReturn(){
  if(!prof.name||!prof.phone)return toast("أكمل اسمك وجوالك من تبويب حسابي أولاً");
  if(!(rt.prod||"").trim())return toast("اكتب اسم المنتج المراد إرجاعه");
  if(rt.oi!=null&&maxRet()<1)return toast("تم طلب إرجاع كامل كمية هذا المنتج");
  const msg=`طلب إرجاع — ${S().name}\n\nالاسم: ${prof.name}\nالجوال: ${prof.phone}\nالمنتج: ${rt.prod}${rt.oi!=null?" × "+(rt.q||1):""}\nالسبب: ${rt.reason}\n${rt.note?"التفاصيل: "+rt.note+"\n":""}${rt.file?"(مرفق صورة المنتج)":""}`;
  sendWa(msg,rt.file||null,()=>{regRet();rt={reason:"تالف"};render()});
}

function maxRet(){const o=orders[rt.oi],it=o&&o.items&&o.items[rt.ii];if(!it)return 1;const done=(o.ret||[]).filter(x=>x.n==it.n).reduce((a,x)=>a+x.q,0);return Math.max(0,it.q-done)}
function startRet(oi,ii){const it=orders[oi].items[ii];rt={reason:"تالف",prod:it.n,oi:oi,ii:ii,q:1};go("m")}
function regRet(){
  let q=Math.max(1,+rt.q||1);const n=rt.prod;
  if(rt.oi!=null&&orders[rt.oi]&&orders[rt.oi].items){const o=orders[rt.oi],it=o.items[rt.ii];if(it){q=Math.min(q,maxRet());(o.ret=o.ret||[]).push({n:it.n,q:q,amt:it.p*q,st:"بانتظار المراجعة"});LS.s("orders",orders)}}
  Object.keys(cart).forEach(id=>{const p=P(id);if(p&&nm(p)===n)delete cart[id]});LS.s("cart",cart);
}
/* ---------- حسابي والمزيد ---------- */
function acct(){
  return `<div class="pg"><h1>👤 حسابي</h1><div class="sub" style="margin-bottom:10px">بياناتك تُحفظ على جوالك فقط لتسريع الطلب القادم.</div>
  <label class="lbl">الاسم</label><input class="f" value="${esc(prof.name||"")}" oninput="prof.name=this.value;LS.s('prof',prof)">
  <label class="lbl">رقم الجوال</label><input class="f" inputmode="tel" value="${esc(prof.phone||"")}" oninput="prof.phone=this.value;LS.s('prof',prof)">
  <label class="lbl">العنوان</label><input class="f" value="${esc(prof.addr||"")}" oninput="prof.addr=this.value;LS.s('prof',prof)">
  <h1 style="margin-top:18px">طلباتي السابقة</h1>
  ${orders.length?orders.map((o,oi)=>{const rr=o.ret||[],rs=rr.reduce((a,x)=>a+x.amt,0);return `<div class="card" style="white-space:normal"><div class="tl"><span>${esc(o.d)} — ${o.n} منتج</span><b class="pp">${fm(o.t)} ${cur()}</b></div>${(o.items||[]).map((it,ii)=>`<div class="tl"><span>${esc(it.n)} × ${it.q}</span><button class="chip" onclick="startRet(${oi},${ii})">↩ إرجاع</button></div>`).join("")}${rr.map(x=>`<div class="tl" style="color:#c0392b"><span>↩ مرتجع: ${esc(x.n)} × ${x.q} (${x.st})</span><b>-${fm(x.amt)}</b></div>`).join("")}${rs?`<div class="tl b"><span>الصافي بعد المرتجع</span><b class="pp">${fm(o.t-rs)} ${cur()}</b></div>`:""}</div>`}).join(""):'<div class="empty">لا توجد طلبات بعد</div>'}</div>`;
}
function more(){
  const s=S(),py=pays();
  return `<div class="pg"><h1>☰ المزيد</h1>
  <div class="card"><h3>🚚 التوصيل</h3>${s.zones.map(z=>`${esc(z.n)}: ${fm(z.fee)} ${cur()}`).join("\n")}${s.eta?`\nمدة التوصيل: ${esc(s.eta)}`:""}${s.minOrder?`\nالحد الأدنى للطلب: ${fm(s.minOrder)} ${cur()}`:""}${s.hours?`\nأوقات العمل: ${esc(s.hours)}`:""}</div>
  <div class="card"><h3>💳 طرق الدفع</h3>${py.length?py.map(x=>esc(x.t)+": "+esc(x.d)).join("\n"):"تواصل معنا لمعرفة طرق الدفع"}</div>
  <div class="card"><h3>↩️ سياسة الإرجاع</h3>${s.retDays?`مدة الإرجاع: ${s.retDays} يوم من الاستلام\n`:""}${esc(s.returns)}</div>
  <div class="card" style="white-space:normal"><h3>↩️ طلب إرجاع</h3><input class="f" placeholder="اسم المنتج المراد إرجاعه" value="${esc(rt.prod||"")}" oninput="rt.prod=this.value;rt.oi=null">${rt.oi!=null?`<label class="lbl">الكمية المرتجعة (المتاح ${maxRet()})</label><input class="f" type="number" min="1" max="${maxRet()}" value="${rt.q||1}" oninput="rt.q=+this.value">`:""}<select class="f" onchange="rt.reason=this.value">${["تالف","مخالف للطلب","منتهي الصلاحية","أخرى"].map(x=>`<option ${rt.reason==x?"selected":""}>${x}</option>`).join("")}</select><textarea class="f" rows="3" placeholder="تفاصيل إضافية" oninput="rt.note=this.value">${esc(rt.note||"")}</textarea>${pickBtns("pickRt")}${rt.url?`<img src="${rt.url}" alt="" style="max-width:140px;border-radius:12px;margin:6px 0">`:""}<button class="btn" onclick="sendReturn()">إرسال طلب الإرجاع عبر واتساب</button></div>
  <button class="btn wa" onclick="window.open('https://wa.me/'+S().whatsapp,'_blank')">تواصل معنا عبر واتساب</button></div>`;
}

/* ---------- الإدارة (للمالك فقط) ---------- */
async function publishNow(){
  try{
    const a=await claude.use("artifact");if(!a){toast("النشر غير متاح هنا");return false}
    const c=document.documentElement.cloneNode(true);
    c.querySelector("#app").innerHTML="";c.querySelector("#nav").innerHTML="";c.querySelector("#ts").className="toast";c.querySelector("#ts").textContent="";
    c.querySelector("#data").textContent=JSON.stringify(D).replace(/</g,"\\u003c");
    toast("جارٍ الحفظ والنشر...");await a.publish("<!DOCTYPE html>\n"+c.outerHTML);return true;
  }catch(e){toast(e&&(e.code=="not_writer"||e.code=="not_granted")?"لا تملك صلاحية التعديل":"تعذر الحفظ، حاول مرة أخرى");return false}
}
function adm(){
  if(!admin)return "";
  if(editId!==null)return prodForm();
  return `<div class="pg"><h1>⚙️ الإدارة</h1><div class="chips" style="padding:0 0 8px"><button class="chip ${av=="p"?"on":""}" onclick="av='p';ed=null;render()">المنتجات</button><button class="chip ${av=="s"?"on":""}" onclick="av='s';initEd();render()">الإعدادات</button></div>${av=="p"?prodList():setForm()}</div>`;
}
function prodList(){
  return `<button class="btn" onclick="editId='new';tmpImg='';render()">➕ إضافة منتج</button><div style="height:10px"></div>`+
  D.products.map(p=>`<div class="row" ${p.hide?'style="opacity:.5"':""}><div class="e">${thumb(p)}</div><div class="i"><div>${esc(p.n)}</div><div class="sub">${fm(p.p)} ${cur()} • ${esc(p.c)}${p.s?" / "+esc(p.s):""}${p.hide?" • مخفي":""}</div></div><button class="ic" onclick="editId=${p.id};tmpImg=P(${p.id}).img||'';render()">✏️</button><button class="ic" onclick="togHide(${p.id})">${p.hide?"👁":"🙈"}</button><button class="ic" onclick="delP(${p.id})">🗑</button></div>`).join("")||'<div class="empty">لا توجد منتجات</div>';
}
function prodForm(){
  const p=editId=="new"?{}:P(editId);
  return `<div class="pg"><h1>${editId=="new"?"منتج جديد":"تعديل المنتج"}</h1>
  <label class="lbl">اسم المنتج</label><input class="f" id="f_n" value="${esc(p.n||"")}">
  <label class="lbl">السعر (${cur()})</label><input class="f" id="f_p" inputmode="numeric" value="${p.p||""}">
  <label class="lbl">القسم</label><select class="f" id="f_c">${D.cats.map(c=>`<option ${p.c==c?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <label class="lbl">القسم الفرعي (اختياري)</label><input class="f" id="f_s" list="sl" value="${esc(p.s||"")}"><datalist id="sl">${[...new Set(Object.values(D.subs).flat())].map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
  <label class="lbl">رمز تعبيري (يظهر إن لم تضع صورة)</label><input class="f" id="f_e" value="${esc(p.e||"")}">
  <label class="lbl">صورة المنتج</label><input type="file" accept="image/*" class="f" onchange="pickImg(this)"><img id="pv" ${tmpImg?`src="${tmpImg}" style="display:block"`:""} alt="">
  <button class="btn" onclick="saveProd()">حفظ ونشر</button><button class="btn gr" onclick="editId=null;render()">إلغاء</button></div>`;
}
function pickImg(inp){const f=inp.files[0];if(f)shrink(f,480,u=>{tmpImg=u;$("pv").src=u;$("pv").style.display="block"})}
async function saveProd(){
  const n=$("f_n").value.trim(),pr=+$("f_p").value;if(!n||!pr)return toast("أدخل الاسم والسعر");
  const o={n,p:pr,c:$("f_c").value,s:$("f_s").value.trim()||undefined,e:$("f_e").value.trim()||"🛍️",img:tmpImg||undefined};
  if(editId=="new"){o.id=Math.max(0,...D.products.map(x=>x.id))+1;D.products.push(o)}
  else{const i=D.products.findIndex(x=>x.id==editId);o.id=D.products[i].id;if(D.products[i].hide)o.hide=true;D.products[i]=o}
  if(o.s&&!(D.subs[o.c]||[]).includes(o.s))(D.subs[o.c]=D.subs[o.c]||[]).push(o.s);
  await publishNow();
}
async function togHide(id){const p=P(id);p.hide=!p.hide;await publishNow()}
async function delP(id){if(delId!=id){delId=id;return toast("اضغط 🗑 مرة أخرى لتأكيد الحذف")}delId=null;D.products=D.products.filter(p=>p.id!=id);await publishNow()}
function initEd(){ed=JSON.parse(JSON.stringify(S()));ed.catsText=D.cats.join("\n");ed.subsText=Object.entries(D.subs).map(([k,v])=>k+"|"+v.join(",")).join("\n")}
const fi=(k,l,x)=>`<label class="lbl">${l}</label><input class="f" ${x||""} value="${esc(ed[k]??"")}" oninput="ed.${k}=this.value">`;
const rows=(k,fs,add)=>ed[k].map((r,i)=>`<div class="card rw" style="white-space:normal">${fs.map(([f,l,x])=>`<input class="f" ${x||""} placeholder="${l}" value="${esc(r[f]??"")}" oninput="ed.${k}[${i}].${f}=this.value">`).join("")}<button class="ic" onclick="ed.${k}.splice(${i},1);render()">🗑</button></div>`).join("")+`<button class="chip" onclick="ed.${k}.push({});render()">➕ ${add}</button>`;
function setForm(){
  if(!ed)initEd();
  return `<h3 class="st">بيانات المتجر</h3><label class="lbl">الشعار</label>${ed.logo?`<img class="logo" src="${ed.logo}" alt="" style="display:block;margin-bottom:6px">`:""}<input type="file" accept="image/*" class="f" onchange="pickLogo(this)">
  ${fi("name","اسم المتجر")}${fi("whatsapp","رقم واتساب (بصيغة دولية بدون +)",'inputmode="tel"')}${fi("hours","أوقات العمل")}
  <h3 class="st">التوصيل</h3>${fi("minOrder","الحد الأدنى للطلب (0 = بدون)",'inputmode="numeric"')}${fi("eta","مدة التوصيل المتوقعة (مثال: خلال ساعتين)")}
  ${rows("zones",[["n","اسم المنطقة"],["fee","رسوم التوصيل",'inputmode="numeric"'],["agent","اسم المندوب (اختياري)"]],"إضافة منطقة")}
  <h3 class="st">المحافظ الإلكترونية</h3>${rows("wallets",[["n","اسم المحفظة (مثل: ون كاش)"],["num","رقم المحفظة"],["holder","اسم صاحب الحساب"]],"إضافة محفظة")}
  <h3 class="st">الحسابات البنكية</h3>${rows("banks",[["n","اسم البنك"],["num","رقم الحساب"],["holder","اسم صاحب الحساب"]],"إضافة حساب بنكي")}
  <h3 class="st">الإرجاع</h3>${fi("retDays","مدة الإرجاع بعد الاستلام (بالأيام)",'inputmode="numeric"')}<label class="lbl">سياسة الإرجاع</label><textarea class="f" rows="4" oninput="ed.returns=this.value">${esc(ed.returns)}</textarea>
  <h3 class="st">الأقسام</h3><label class="lbl">الأقسام (سطر لكل قسم)</label><textarea class="f" rows="5" oninput="ed.catsText=this.value">${esc(ed.catsText)}</textarea><label class="lbl">الأقسام الفرعية (سطر لكل قسم: القسم|فرعي1,فرعي2)</label><textarea class="f" rows="4" oninput="ed.subsText=this.value">${esc(ed.subsText)}</textarea>
  <button class="btn" onclick="saveSet()">حفظ ونشر</button>`;
}
async function saveSet(){
  const e=ed,s=S(),cl=a=>a.filter(r=>(r.n||"").trim()).map(r=>({...r,n:r.n.trim()}));
  const zones=cl(e.zones).map(z=>({n:z.n,fee:+z.fee||0,agent:(z.agent||"").trim()}));
  if(!zones.length)return toast("أضف منطقة توصيل واحدة على الأقل");
  s.name=(e.name||"").trim()||s.name;s.whatsapp=String(e.whatsapp||"").replace(/\D/g,"");s.hours=(e.hours||"").trim();s.eta=(e.eta||"").trim();
  s.minOrder=+e.minOrder||0;s.retDays=+e.retDays||0;s.returns=(e.returns||"").trim();s.logo=e.logo;s.zones=zones;s.wallets=cl(e.wallets);s.banks=cl(e.banks);
  D.cats=L(e.catsText);D.subs={};L(e.subsText).forEach(x=>{const a=x.split("|").map(y=>y.trim());if(a[0])D.subs[a[0]]=(a[1]||"").split(",").map(y=>y.trim()).filter(Boolean)});
  await publishNow();
}

/* ---------- التنقل ---------- */
function navV(){
  const t=[["h","🏠","الرئيسية"],["c","🛒","السلة"],["a","👤","حسابي"],["m","☰","المزيد"]];if(admin)t.push(["x","⚙️","إدارة"]);
  return `${cartBar()}<nav>${t.map(([k,i,l])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}${k=="c"&&cartN()?`<b class="badge">${cartN()}</b>`:""}</button>`).join("")}</nav>`;
}
const go=k=>{tab=k;render();scrollTo(0,0)};
function render(){$("app").innerHTML=({h:home,c:cartV,a:acct,m:more,x:adm})[tab]();$("nav").innerHTML=navV()}
render();
document.title=S().name;
/* وضع العملاء: بدون إدارة داخل الصفحة */
</script>
