<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة أسواق الريشي</title>
<meta name="robots" content="noindex">
<style>
:root{--pr:#0f7b5f;--bg:#f4f4f0;--card:#fff;--tx:#1d1d1b;--mu:#777;--bd:#e3e3dc;--rd:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--card:#1d211e;--tx:#eee;--mu:#9a9f9b;--bd:#323833}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:90px}
h2{margin:0 0 10px;font-size:18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:8px 14px;white-space:nowrap;font-size:14px}
.tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 12px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700}
.btn.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.btn.d{background:transparent;color:var(--rd);border:1px solid var(--rd);padding:8px 10px}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}
.row>*{flex:1;min-width:0}
.row .sm{flex:0 0 auto}
.gh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.th{width:58px;height:58px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex:0 0 58px;border:1px dashed var(--bd);position:relative}
.th img{width:100%;height:100%;object-fit:contain}
.th input{position:absolute;inset:0;opacity:0}
.v{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:5px;margin-top:6px;align-items:center}
.v input{padding:8px;font-size:14px}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.chk input{width:auto}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:9}
.bar .btn{flex:1}
.msg{font-size:13px;color:var(--mu)}
.err{color:var(--rd);font-size:14px;margin-top:8px}
.dim{opacity:.45}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
.vc{display:flex;gap:6px;align-items:center;margin:3px 0 8px}
.vc input{padding:7px;font-size:13px;flex:1;min-width:0}
.vc .pf{flex:1.4;font-size:12px;color:var(--mu);text-align:center}
.pf.ok{color:var(--pr);font-weight:700}.pf.bad{color:var(--rd);font-weight:700}
</style>
</head>
<body>
<div id="app"><div class="box">جاري التحميل…</div></div>
<script>setTimeout(function(){if(!window.__adminOk){var a=document.getElementById("app");if(a)a.innerHTML='<div class="box"><h2>تعذّر تحميل لوحة الإدارة</h2><p>المتصفح لم يستطع تحميل مكتبات Firebase. جرّب: تحديث الصفحة بقوة، أو متصفح آخر، أو إيقاف حاجب الإعلانات/الإضافات، أو شبكة إنترنت أخرى (بعض الشبكات تحجب gstatic.com).</p></div>'}},8000)</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,createUserWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,orderBy,limit,getDocs,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

window.__adminOk=true;
const cfg={apiKey:"AIzaSyBWzRYgl7OR7jeu6BKrbNR7bAdtHZGv4oc",authDomain:"alrishi-store.firebaseapp.com",projectId:"alrishi-store",storageBucket:"alrishi-store.firebasestorage.app",messagingSenderId:"637291205682",appId:"1:637291205682:web:3edf4180e90c67bb36182b"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const R=k=>doc(db,"store",k);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=t=>String(t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/(^|\s)ارز/g,"$1رز").toLowerCase();
const fm=n=>Number(n||0).toLocaleString("en-US");

const hkey=s=>{let h=5381;for(const c of String(s))h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36)};
const BIGR=k=>doc(db,"store","pi_"+hkey(k));
let BIG={},bigDirty=new Set();
let CO={},coDirty=false,costsOK=true,authMode="in",info="",roleErr="";
let role="none",ORD=[],RET=[],ofil="all",oq="",ordMsg="",ordLoaded=false,STAFF={managers:[],orders:[]};
const OWNER="alrishi562@gmail.com";
let U=null,C=null,ST=null,IM={},tab="p",q="",dirty=false,msg="",err="",busy=false,needSeed=false;

/* ---------- البيانات ---------- */
async function load(){
  const [c,s,i]=await Promise.all(["catalog","settings","images"].map(k=>getDoc(R(k))));
  if(!c.exists()||!s.exists()){needSeed=true;C=null;return}
  C=JSON.parse(c.data().json);ST=JSON.parse(s.data().json);IM=i.exists()?JSON.parse(i.data().json):{};
  needSeed=false;
  try{const c=await getDoc(doc(db,"private","costs"));CO=c.exists()?JSON.parse(c.data().json):{};costsOK=true}catch(e){CO={};costsOK=false}
  coDirty=false;
}
async function save(){
  busy=true;msg="جاري الحفظ…";bar();
  try{
    await Promise.all([
      setDoc(R("catalog"),{json:JSON.stringify(C),t:Date.now()}),
      setDoc(R("settings"),{json:JSON.stringify(ST),t:Date.now()}),
      setDoc(R("images"),{json:JSON.stringify(IM),t:Date.now()})]);
    dirty=false;msg="تم الحفظ ✅ وظهر عند الزبائن";
  }catch(e){msg="تعذّر الحفظ: "+(e.code||e.message)}
  if(bigDirty.size){
    try{for(const k of [...bigDirty]){await setDoc(BIGR(k),{json:JSON.stringify({k,img:BIG[k]}),t:Date.now()});bigDirty.delete(k)}}
    catch(e){msg+=" — تعذّر حفظ نسخة الصورة الكبيرة ("+(e.code||e.message)+")"}
  }
  if(coDirty){
    try{await setDoc(doc(db,"private","costs"),{json:JSON.stringify(CO),t:Date.now()});coDirty=false;costsOK=true}
    catch(e){costsOK=false;msg+=" — لكن تعذّر حفظ أسعار الشراء ("+(e.code||e.message)+"): حدّث قواعد Firebase"}
  }
  busy=false;bar();
}
window.seed=async()=>{
  busy=true;err="";render();
  try{
    const t=await (await fetch("./index.html?"+Date.now())).text();
    const m=t.match(/<script type="application\/json" id="data">([\s\S]*?)<\/script>/);
    const D=JSON.parse(m[1]);IM={};
    D.products.forEach(p=>{if(p.img){IM[p.g||"#"+p.id]=p.img;delete p.img}});
    C={products:D.products,subs:D.subs,cats:D.cats};ST=D.settings;needSeed=false;
    await save();
  }catch(e){err="تعذّر الاستيراد: "+(e.code||e.message)}
  busy=false;render();
};

/* ---------- الدخول ---------- */
async function enter(){
  err="";role="none";ordLoaded=false;ORD=[];RET=[];
  if(U){
    await detectRole();
    if(role=="owner"||role=="manager"){try{await load()}catch(e){err="تعذّر قراءة البيانات: "+(e.code||e.message)}}
    if(role=="orders")tab="o";
  }
  render();
  if(U&&role=="orders")loadOrders();
}
onAuthStateChanged(auth,async u=>{U=u;if(!u){authMode="in";info=""}await enter()});
const fbErr=e=>({"auth/network-request-failed":"تعذّر الاتصال بخوادم Firebase. تأكد من الإنترنت، وأن الشبكة أو الإضافات (حاجب الإعلانات/الحماية) لا تحجب google.com و gstatic.com.","auth/unauthorized-domain":"هذا الموقع غير مسموح في Firebase. أضف الدومين في Authentication ثم Settings ثم Authorized domains.","auth/operation-not-allowed":"طريقة الدخول بالإيميل غير مفعّلة في Firebase.","auth/user-disabled":"هذا الحساب موقوف.","auth/invalid-api-key":"مفتاح Firebase غير صالح.","auth/email-already-in-use":"هذا الإيميل مسجّل مسبقاً. اضغط «لدي حساب» أو «نسيت كلمة المرور».","auth/weak-password":"كلمة المرور ضعيفة، اجعلها 6 أحرف أو أكثر.","auth/invalid-email":"الإيميل غير صحيح.","auth/too-many-requests":"محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة.","auth/user-not-found":"لا يوجد حساب بهذا الإيميل."}[e&&e.code]||("تعذّر التنفيذ: "+((e&&e.code)||(e&&e.message))));
window.retryRole=async()=>{await enter()};
window.am=m=>{authMode=m;err="";info="";render()};
window.authGo=async()=>{
  const em=$("em").value.trim(),pw=$("pw")?$("pw").value:"";
  err="";info="";busy=true;render();
  try{
    if(authMode=="reset"){await sendPasswordResetEmail(auth,em);info="أرسلنا رابط استعادة كلمة المرور إلى بريدك (تفقد الرسائل غير المرغوبة أيضاً)."}
    else if(authMode=="up"){
      if(pw.length<6)err="كلمة المرور 6 أحرف على الأقل.";
      else{const c=await createUserWithEmailAndPassword(auth,em,pw);try{await sendEmailVerification(c.user)}catch(e){}}
    }else await signInWithEmailAndPassword(auth,em,pw);
  }catch(e){const bad=["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(e&&e.code);err=authMode=="in"?(bad?"الإيميل أو كلمة المرور غير صحيحة (تأكد من لغة الكيبورد، ومن حروف الإيميل).":fbErr(e)):fbErr(e)}
  busy=false;if(!U)render();
};
window.login=window.authGo;
window.resendVer=async()=>{try{await sendEmailVerification(auth.currentUser);info="أعدنا إرسال رابط التأكيد."}catch(e){info=fbErr(e)}render()};
window.chkVer=async()=>{
  try{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);U=auth.currentUser}catch(e){info=fbErr(e)}
  if(U&&(U.emailVerified)){info="";await enter()}else{info="لسا ما تأكد البريد. افتح الرسالة واضغط على الرابط داخلها، ثم ارجع هنا.";render()}
};
window.logout=()=>signOut(auth);
async function detectRole(){
  const em=(U.email||"").toLowerCase();roleErr="";
  if(em!=OWNER){try{await U.reload();await U.getIdToken(true)}catch(e){}}
  if(em!=OWNER&&!U.emailVerified){role="unverified";return}
  let r={};try{const d=await getDoc(doc(db,"staff","roles"));if(d.exists())r=d.data()}catch(e){roleErr=e.code||e.message}
  STAFF={managers:r.managers||[],orders:r.orders||[]};
  role=em==OWNER?"owner":STAFF.managers.includes(em)?"manager":STAFF.orders.includes(em)?"orders":"none";
}

/* ---------- المنتجات ---------- */
const gkey=p=>p.g||"#"+p.id;
function groups(){
  const m=new Map(),w=nz(q).split(/\s+/).filter(Boolean);
  C.products.forEach(p=>{
    const t=nz(p.n+" "+(p.g||"")+" "+(p.s||""));
    if(w.length&&!w.every(x=>t.includes(x)))return;
    const k=gkey(p);if(!m.has(k))m.set(k,{k,t:p.g||p.n,v:[]});m.get(k).v.push(p);
  });
  m.forEach(g=>g.v.sort((a,b)=>(a.o||0)-(b.o||0)));
  return [...m.values()];
}
const allOf=k=>C.products.filter(p=>gkey(p)==k);
function listH(){
  const gs=groups();
  if(!gs.length)return '<div class="box">لا توجد نتائج</div>';
  const subs=C.subs||{};
  return gs.map(g=>{
    const f=g.v[0],cat=f.c,sl=(subs[cat]||[]);
    return `<div class="box"><div class="gh">
      <div class="th">${IM[g.k]?`<img src="${IM[g.k]}">`:esc(f.e||"🛍️")}<input type="file" accept="image/*" onchange="upl('${esc(g.k)}',this)"></div>
      <div style="flex:1"><input value="${esc(g.t)}" onchange="ren('${esc(g.k)}',this.value)">
      <div class="row"><select onchange="setcat('${esc(g.k)}',this.value)">${(C.cats||[]).map(c=>`<option ${c==cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
      ${sl.length?`<select onchange="setsub('${esc(g.k)}',this.value)"><option value=""></option>${sl.map(s=>`<option ${s==f.s?"selected":""}>${esc(s)}</option>`).join("")}</select>`:""}</div></div></div>
      <textarea rows="2" placeholder="تفاصيل المنتج (تظهر للزبون عند الضغط على المنتج)" onchange="setdesc('${esc(g.k)}',this.value)" style="margin-bottom:6px">${esc(f.d||"")}</textarea>
      ${g.v.map(p=>`<div class="v ${p.hide?"dim":""}">
        <input value="${esc(p.u||"")}" placeholder="الوحدة" onchange="setv(${p.id},'u',this.value)">
        <input type="number" inputmode="numeric" value="${p.p}" onchange="setv(${p.id},'p',+this.value)">
        <input type="number" inputmode="numeric" value="${p.old||""}" placeholder="قبل الخصم" onchange="setv(${p.id},'old',+this.value||0)">
        <div><label class="chk"><input type="checkbox" ${p.hide?"checked":""} onchange="setv(${p.id},'hide',this.checked)">مخفي</label>
        <button class="btn d" onclick="delv(${p.id})">حذف</button></div></div><div class="vc"><input type="number" inputmode="numeric" placeholder="سعر الشراء" value="${CO[p.id]||""}" onchange="setcost(${p.id},+this.value)"><span class="pf ${pfCls(p)}" id="pf${p.id}">${pfTxt(p)}</span><input type="number" inputmode="decimal" placeholder="ربح %" onchange="setmk(${p.id},+this.value);this.value=''"></div>${stkRow(p)}`).join("")}
      <div class="row"><button class="btn s sm" onclick="addv('${esc(g.k)}')">+ إضافة وحدة</button></div></div>`}).join("");
}

function catH(){
  const cats=C.cats||[],subs=C.subs||{};
  const n=c=>C.products.filter(p=>p.c==c).length;
  return `<div class="hint">الأقسام تظهر للزبون في الشريط العلوي. الحذف يتم فقط للقسم الفاضي من المنتجات.</div>`+
  cats.map((c,i)=>`<div class="box" style="background:#f8f8f8"><div class="row">
    <input value="${esc(c)}" onchange="catRen(${i},this.value)" style="flex:1">
    <button class="btn s sm" onclick="catMv(${i},-1)">▲</button><button class="btn s sm" onclick="catMv(${i},1)">▼</button>
    <button class="btn d sm" onclick="catDel(${i})">حذف</button></div>
    <div class="hint">${n(c)} منتج</div>
    ${(subs[c]||[]).map((x,j)=>`<div class="row" style="margin-top:4px"><span>↳</span><input value="${esc(x)}" onchange="subRen(${i},${j},this.value)" style="flex:1"><button class="btn d sm" onclick="subDel(${i},${j})">حذف</button></div>`).join("")}
    <div class="row" style="margin-top:6px"><input id="ns${i}" placeholder="قسم فرعي جديد" style="flex:1"><button class="btn s sm" onclick="subAdd(${i})">+ فرعي</button></div></div>`).join("")+
  `<div class="row"><input id="nc_n" placeholder="اسم قسم جديد" style="flex:1"><button class="btn" onclick="catAdd()">+ إضافة قسم</button></div>`;
}
const reCat=()=>setTimeout(()=>{const l=$("catlist");if(l)l.innerHTML=catH();const c=$("np_c");if(c){c.innerHTML=(C.cats||[]).map(x=>`<option>${esc(x)}</option>`).join("");npc()}reList()},0);
window.catAdd=()=>{const v=$("nc_n").value.trim();if(!v)return;if((C.cats||[]).includes(v))return alert("القسم موجود");C.cats.push(v);C.subs=C.subs||{};C.subs[v]=[];touch();reCat()};
window.catRen=(i,v)=>{v=v.trim();const o=C.cats[i];if(!v||v==o)return reCat();if(C.cats.includes(v)){alert("الاسم مستخدم");return reCat()}
  C.cats[i]=v;C.subs[v]=C.subs[o]||[];delete C.subs[o];C.products.forEach(p=>{if(p.c==o)p.c=v});touch();reCat()};
window.catMv=(i,d)=>{const j=i+d;if(j<0||j>=C.cats.length)return;[C.cats[i],C.cats[j]]=[C.cats[j],C.cats[i]];touch();reCat()};
window.catDel=i=>{const c=C.cats[i];if(C.products.some(p=>p.c==c))return alert("القسم فيه منتجات. انقلها لقسم ثاني أولاً.");
  if(!confirm("حذف القسم «"+c+"»؟"))return;C.cats.splice(i,1);delete C.subs[c];touch();reCat()};
window.subAdd=i=>{const c=C.cats[i],v=$("ns"+i).value.trim();if(!v)return;C.subs[c]=C.subs[c]||[];if(C.subs[c].includes(v))return;C.subs[c].push(v);touch();reCat()};
window.subRen=(i,j,v)=>{v=v.trim();const c=C.cats[i],o=C.subs[c][j];if(!v||v==o)return reCat();C.subs[c][j]=v;C.products.forEach(p=>{if(p.c==c&&p.s==o)p.s=v});touch();reCat()};
window.subDel=(i,j)=>{const c=C.cats[i],o=C.subs[c][j];if(!confirm("حذف القسم الفرعي «"+o+"»؟ المنتجات ستبقى بدون قسم فرعي."))return;C.subs[c].splice(j,1);C.products.forEach(p=>{if(p.c==c&&p.s==o)delete p.s});touch();reCat()};
function prodH(){
  const cats=C.cats||[];
  return `<div class="box"><input id="q" placeholder="🔍 ابحث عن منتج" value="${esc(q)}" oninput="srch(this.value)">
    <div class="hint">السعر الأول = السعر الحالي. «قبل الخصم» اتركه فاضي لو ما فيه تخفيض.</div></div>
    <details class="box" id="cbox"><summary style="font-weight:700;cursor:pointer">🗂️ إدارة الأقسام</summary><div id="catlist">${catH()}</div></details>
    <div class="box"><h2>➕ منتج جديد</h2>
    <label>الاسم</label><input id="np_n"><div class="row"><div><label>القسم</label><select id="np_c" onchange="npc()">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
    <div><label>القسم الفرعي</label><select id="np_s"></select></div></div>
    <div class="row"><div><label>الوحدة</label><input id="np_u" placeholder="كرتون / حبة"></div><div><label>السعر</label><input id="np_p" type="number" inputmode="numeric"></div></div>
    <div class="row"><button class="btn" onclick="addp()">إضافة</button></div></div>
    <div id="list">${listH()}</div>`;
}
const pfTxt=p=>{const c=+CO[p.id];if(!c)return "أدخل سعر الشراء";const d=p.p-c,pc=Math.round(d/c*1000)/10;return (d>=0?"ربح ":"خسارة ")+fm(Math.abs(d))+" ("+pc+"%)"};
const pfCls=p=>{const c=+CO[p.id];return !c?"":p.p>=c?"ok":"bad"};
const pfUpd=id=>{const p=C.products.find(x=>x.id==id),e=$("pf"+id);if(p&&e){e.textContent=pfTxt(p);e.className="pf "+pfCls(p)}};
const fOf=p=>+p.f>1?+p.f:1;
const isLinked=k=>allOf(k).some(p=>+p.f>1);
const gqOfK=k=>{const g=allOf(k).find(x=>x.gq!=null);return g?+g.gq:null};
function stkRow(p){
  const k=gkey(p),lk=isLinked(k),gq=gqOfK(k),val=lk?(gq!=null?Math.floor(gq/fOf(p)):""):(p.q??"");
  return `<div class="vc"><span class="pf" style="flex:1.5">يحتوي على كم من أصغر وحدة؟ (الأصغر: فاضي)</span><input type="number" inputmode="numeric" placeholder="مثال: 24" value="${p.f||""}" onchange="setf(${p.id},this.value)"></div>

  const td=new Date().toDateString(),ts=ORD.filter(o=>new Date(o.t).toDateString()==td&&o.st!="cancel"),sum=ts.reduce((a,o)=>a+(+o.total||0),0);
  const fl=[["all","الكل"],["new","🆕 جديد"],["prep","📦 تجهيز"],["way","🚚 طريق"],["done","✅ تم"],["cancel","❌ ملغي"],["ret","↩️ مرتجعات"]];
  return `<div class="box"><div class="row"><b>📋 الطلبات</b><button class="btn s sm" onclick="loadOrders()">🔄 تحديث</button></div>
  <div class="hint">طلبات اليوم: ${ts.length} • إجماليها: ${fm(sum)}</div>${ordMsg?`<div class="${ordMsg.startsWith("تعذّر")?"err":"hint"}">${esc(ordMsg)}</div>`:""}
  <input placeholder="🔍 الاسم أو الجوال أو رقم الطلب" value="${esc(oq)}" oninput="osrch(this.value)" style="margin-top:8px">
  <div class="tabs" style="padding:8px 0 0">${fl.map(([k,l])=>`<button class="tab ${ofil==k?"on":""}" onclick="ofl('${k}')">${l}</button>`).join("")}</div></div><div id="olist">${ordListH()}</div>`;
}
window.osrch=v=>{oq=v;$("olist").innerHTML=ordListH()};
window.ofl=k=>{ofil=k;render()};
let stkNote="";
const STK_ST=["prep","way","done"];
function applyStock(o,sign){
  const L=[];
  (o.items||[]).forEach(it=>{
    const p=C.products.find(x=>x.n==it.n);if(!p){L.push("⚠️ غير موجود في المنتجات: "+it.n);return}
    const k=gkey(p),g=gqOfK(k);
    if(isLinked(k)&&g!=null){const ng=Math.max(0,g+sign*(+it.q)*fOf(p));allOf(k).forEach(x=>x.gq=ng);L.push(it.n+" ← باقي "+Math.floor(ng/fOf(p)))}
    else if(p.q!=null){p.q=Math.max(0,+p.q+sign*(+it.q));L.push(it.n+" ← باقي "+p.q)}
  });
  return L;
}
window.setSt=async(col,id,v)=>{
  stkNote="";
  try{await updateDoc(doc(db,col,id),{st:v});const a=col=="orders"?ORD:RET,x=a.find(o=>o.id==id);if(x)x.st=v}
  catch(e){alert("تعذّر تغيير الحالة: "+(e.code||e.message));const l=$("olist");if(l)l.innerHTML=ordListH();return}
  if(col=="orders"&&C&&(role=="owner"||role=="manager")){
    const o=ORD.find(x=>x.id==id);
    if(o){const key=o.no||o.id,want=STK_ST.includes(v),has=!!(C.ded&&C.ded[key]);let L=null;
      if(want&&!has){L=applyStock(o,-1);C.ded=C.ded||{};C.ded[key]=1}
      else if(!want&&has){L=applyStock(o,1);delete C.ded[key]}
      if(L){
        const ks=Object.keys(C.ded||{});if(ks.length>600)ks.slice(0,ks.length-600).forEach(k=>delete C.ded[k]);
        try{await setDoc(R("catalog"),{json:JSON.stringify(C),t:Date.now()});
          stkNote=(want?"📦 خُصمت الكمية من المخزون":"↩️ أُعيدت الكمية للمخزون")+(L.length?":<br>"+L.map(esc).join("<br>"):" (لا توجد أصناف بمخزون محدد)")}
        catch(e){stkNote="⚠️ تغيّرت الحالة لكن تعذّر تحديث المخزون: "+esc(e.code||e.message)}
      }}
  }
  const l=$("olist");if(l)l.innerHTML=(stkNote?'<div class="box" style="background:#e8f5e9;font-size:13px">'+stkNote+'</div>':'')+ordListH();
};
window.delOrd=async(col,id)=>{
  if(!confirm("حذف نهائي؟"))return;
  try{await deleteDoc(doc(db,col,id));if(col=="orders")ORD=ORD.filter(o=>o.id!=id);else RET=RET.filter(o=>o.id!=id)}catch(e){alert("تعذّر الحذف: "+(e.code||e.message))}
  render();
};
window.cpInv=async id=>{
  const o=ORD.find(x=>x.id==id);if(!o)return;
  const bar="━━━━━━━━━━━━━━━━━━",sep="──────────────────";
  const t=[bar,"🧾 *فاتورة طلب — "+((ST&&ST.name)||"أسواق الريشي")+"*",bar,"*رقم الطلب:* "+o.no,"*التاريخ:* "+fdt(o.t),"","👤 *بيانات العميل*","الاسم: "+o.name,"الجوال: "+o.phone,"المنطقة: "+o.zone,"العنوان: "+String(o.addr||"").replace(/\s*\|\s*https?:\/\/\S+/,""),...((m=>m?["📍 الموقع: "+m[0]]:[])(String(o.addr||"").match(/https?:\/\/\S+/))),"","🛒 *الأصناف*",sep,...(o.items||[]).map((i,k)=>`${k+1}) ${i.n}\n     ${i.q} × ${fm(i.p)} = *${fm(i.p*i.q)}*`),sep,"المنتجات: "+fm(o.sub),"التوصيل: "+fm(o.fee),"*الإجمالي: "+fm(o.total)+"*",sep,"شكراً لتسوقكم 🌿",bar].join("\n");
  try{await navigator.clipboard.writeText(t);alert("تم نسخ الفاتورة ✅")}catch(e){prompt("انسخ الفاتورة:",t)}
};

/* ---------- الموظفون ---------- */
function staffH(){
  const lst=(k,title,hint)=>`<div class="box"><h2>${title}</h2><div class="hint">${hint}</div>${(STAFF[k]||[]).map((e,i)=>`<div class="row"><input value="${esc(e)}" readonly dir="ltr"><button class="btn d sm" onclick="rmStaff('${k}',${i})">حذف</button></div>`).join("")||'<div class="hint">لا أحد</div>'}
    <div class="row"><input id="sf_${k}" type="email" placeholder="الإيميل" dir="ltr"><button class="btn s sm" onclick="addStaff('${k}')">+ إضافة</button></div></div>`;
  return `<div class="box"><div class="hint">1) أضف إيميل الموظف هنا واضغط «حفظ الموظفين».<br>2) أرسل له رابط الإدارة. يضغط «حساب جديد» بنفس الإيميل ويختار كلمة مرور ويؤكد بريده.<br>3) بعدها يدخل ويشوف فقط اللي يخصه.</div></div>`+
    lst("orders","🧾 موظفو الطلبات","يشوفون الطلبات والمرتجعات ويغيّرون حالتها فقط.")+
    lst("managers","🛠️ مديرو المتجر","يعدّلون المنتجات والإعدادات والطلبات (بدون إدارة الموظفين).")+
    `<div class="box"><button class="btn" onclick="saveStaff()">💾 حفظ الموظفين</button><div id="stm" class="msg" style="margin-top:6px"></div></div>`;
}
window.addStaff=k=>{const v=$("sf_"+k).value.trim().toLowerCase();if(!v||!v.includes("@"))return alert("اكتب إيميلاً صحيحاً");STAFF[k]=STAFF[k]||[];if(!STAFF[k].includes(v))STAFF[k].push(v);render()};
window.rmStaff=(k,i)=>{STAFF[k].splice(i,1);render()};
window.saveStaff=async()=>{try{await setDoc(doc(db,"staff","roles"),{managers:STAFF.managers||[],orders:STAFF.orders||[]});$("stm").textContent="تم الحفظ ✅"}catch(e){$("stm").textContent="تعذّر الحفظ: "+(e.code||e.message)}};

/* ---------- الواجهة ---------- */

/* ---------- التقارير ---------- */
let rfil="7";
const dayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
function repH(){
  if(ordMsg)return `<div class="box">${esc(ordMsg)}</div>`;
  if(!ordLoaded)return '<div class="box">جاري تحميل الطلبات…</div>';
  const from=rfil=="1"?dayStart():rfil=="all"?0:Date.now()-(+rfil)*864e5;
  const L=ORD.filter(o=>o.st!="cancel"&&(+o.t||0)>=from);
  const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
  const sales=sum(L,o=>o.total),fees=sum(L,o=>o.fee),sub=sum(L,o=>o.sub);
  const pm=new Map(),zm=new Map();let profit=0,nocost=0;
  L.forEach(o=>{
    const z=zm.get(o.zone||"—")||{n:0,t:0};z.n++;z.t+=+o.total||0;zm.set(o.zone||"—",z);
    (o.items||[]).forEach(it=>{
      const e=pm.get(it.n)||{q:0,t:0};e.q+=+it.q||0;e.t+=(+it.p||0)*(+it.q||0);pm.set(it.n,e);
      const pr=C&&C.products.find(x=>x.n==it.n),c=pr?+CO[pr.id]:0;
      if(c>0)profit+=((+it.p||0)-c)*(+it.q||0);else nocost+=1;
    });
  });
  const top=[...pm.entries()].sort((a,b)=>b[1].q-a[1].q).slice(0,10);
  const fl=[["1","اليوم"],["7","7 أيام"],["30","30 يوم"],["all","الكل"]];
  const card=(t,v)=>`<div class="box" style="flex:1;min-width:140px;text-align:center"><div class="hint">${t}</div><b style="font-size:18px">${v}</b></div>`;
  return `<div class="box"><div class="tabs" style="padding:0">${fl.map(([k,l])=>`<button class="tab ${rfil==k?"on":""}" onclick="rfl('${k}')">${l}</button>`).join("")}</div>
    <div class="hint" style="margin-top:6px">تُحسب الطلبات غير الملغية من آخر ${ORD.length} طلب محمّل. <a href="#" onclick="loadOrders();return false">🔄 تحديث</a></div></div>
  <div class="row" style="flex-wrap:wrap">${card("عدد الطلبات",L.length)}${card("المبيعات",fm(sales))}</div>
  <div class="row" style="flex-wrap:wrap">${card("المنتجات",fm(sub))}${card("رسوم التوصيل",fm(fees))}</div>
  <div class="row" style="flex-wrap:wrap">${card("الربح التقديري",fm(Math.round(profit)))}${card("متوسط الطلب",L.length?fm(Math.round(sales/L.length)):0)}</div>
  ${nocost?`<div class="hint">الربح محسوب للأصناف اللي أدخلت لها سعر الشراء فقط (${nocost} بند بدون سعر شراء).</div>`:""}
  <div class="box"><h2>🏆 الأكثر مبيعاً</h2>${top.length?top.map(([n,e],i)=>`<div class="row" style="justify-content:space-between"><span>${i+1}. ${esc(n)}</span><b>${e.q} × — ${fm(e.t)}</b></div>`).join(""):"لا توجد بيانات"}</div>
  <div class="box"><h2>🗺️ حسب المنطقة</h2>${zm.size?[...zm.entries()].sort((a,b)=>b[1].t-a[1].t).map(([n,e])=>`<div class="row" style="justify-content:space-between"><span>${esc(n)}</span><b>${e.n} طلب — ${fm(e.t)}</b></div>`).join(""):"لا توجد بيانات"}</div>`;
}
window.rfl=k=>{rfil=k;render()};
window.go=t=>{tab=t;render();if((t=="o"||t=="r")&&!ordLoaded)loadOrders()};
function bar(){
  const m=$("bm"),s=$("bs");if(!m||!s)return;
  m.textContent=msg||(dirty?"⚠️ عندك تعديلات غير محفوظة":"");
  s.disabled=busy||!dirty;
}
window.save=save;
function render(){
  const a=$("app");
  if(!U){
    const t=authMode=="up"?"🆕 حساب جديد":authMode=="reset"?"🔑 استعادة كلمة المرور":"🔐 دخول الإدارة";
    a.innerHTML=`<div class="box" style="margin-top:40px"><h2>${t}</h2><label>الإيميل</label><input id="em" type="email" autocomplete="username" dir="ltr">${authMode!="reset"?`<label>كلمة المرور</label><input id="pw" type="password" autocomplete="${authMode=="up"?"new-password":"current-password"}" onkeydown="if(event.key=='Enter')authGo()">`:""}
    <div class="row"><button class="btn" ${busy?"disabled":""} onclick="authGo()">${authMode=="up"?"إنشاء الحساب":authMode=="reset"?"إرسال رابط الاستعادة":"دخول"}</button></div>
    ${err?`<div class="err">${esc(err)}</div>`:""}${info?`<div class="hint" style="font-size:14px">${esc(info)}</div>`:""}
    <div class="row" style="margin-top:12px">${authMode!="in"?`<button class="btn s sm" onclick="am('in')">لدي حساب</button>`:`<button class="btn s sm" onclick="am('up')">حساب جديد</button><button class="btn s sm" onclick="am('reset')">نسيت كلمة المرور</button>`}</div>
    <div class="hint" style="margin-top:10px">موظف جديد؟ اضغط «حساب جديد» بنفس الإيميل اللي أضافه لك المالك، ثم أكّد بريدك.</div></div>`;
    return;
  }
  const top=`<div class="top"><b>إدارة أسواق الريشي</b><span><span class="msg">${esc(U.email)}</span> <button class="btn d" onclick="logout()">خروج</button></span></div>`;
  if(role=="unverified"){a.innerHTML=top+`<div class="box"><h2>📧 أكّد بريدك الإلكتروني</h2><p>أرسلنا رابط تأكيد إلى <b dir="ltr">${esc(U.email)}</b>. افتح الرسالة (وتفقد الرسائل غير المرغوبة) واضغط على الرابط، ثم ارجع واضغط الزر.</p><div class="row"><button class="btn" onclick="chkVer()">لقد أكّدت بريدي</button><button class="btn s sm" onclick="resendVer()">إعادة إرسال</button></div>${info?`<div class="hint" style="font-size:14px">${esc(info)}</div>`:""}</div>`;return}
  if(role=="none"){a.innerHTML=top+`<div class="box"><h2>لا توجد صلاحية لهذا الحساب</h2><p>الحساب: <b dir="ltr">${esc(U.email)}</b></p><p>${roleErr?"تعذّر قراءة قائمة الموظفين ("+esc(roleErr)+"). تأكد أن قواعد Firebase الجديدة منشورة وأن بريدك مؤكَّد.":"إيميلك غير موجود في قائمة المديرين أو موظفي الطلبات. اطلب من المالك إضافته بنفس هذا الإيميل بالضبط، ثم الضغط على «حفظ الموظفين»."}</p><div class="row"><button class="btn" onclick="retryRole()">🔄 إعادة المحاولة</button></div></div>`;return}
  const canEdit=role=="owner"||role=="manager";
  if(canEdit&&needSeed){
    a.innerHTML=top+`<div class="box"><h2>أول مرة؟</h2><p>القاعدة فاضية. اضغط الزر لنقل بيانات المتجر الحالية (المنتجات والأسعار والإعدادات والصور) إلى قاعدة البيانات.</p><button class="btn" ${busy?"disabled":""} onclick="seed()">استيراد بيانات المتجر</button>${err?`<div class="err">${esc(err)}</div>`:""}</div>`;
    return;
  }
  if(canEdit&&!C){a.innerHTML=top+`<div class="box">${esc(err)||"جاري التحميل…"}</div>`;return}
  const tabs=canEdit?[["p","📦 المنتجات"],["s","⚙️ الإعدادات"],["z","🚚 التوصيل"],["b","🏦 الحسابات"],["t","📥 تعديلات"],["o","📋 الطلبات"],["r","📊 التقارير"],...(role=="owner"?[["u","👥 الموظفون"]]:[])]:[["o","📋 الطلبات"]];
  if(!tabs.some(([k])=>k==tab))tab=tabs[0][0];
  const showBar=canEdit&&tab!="o"&&tab!="u"&&tab!="r";
  a.innerHTML=top+`<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${tab==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}</div>`+
    (tab=="p"?prodH():tab=="s"?setH():tab=="z"?zonesH():tab=="t"?patchH():tab=="o"?ordH():tab=="r"?repH():tab=="u"?staffH():banksH())+(showBar?`<div class="bar" id="bar"><span class="msg" id="bm"></span><button class="btn" id="bs" onclick="save()">💾 حفظ</button></div>`:"");
  bar();
  if(tab=="p")npc();
}
render();
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
</script>
